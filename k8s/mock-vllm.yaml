apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-vllm-script
data:
  server.py: |
    import http.server
    import time
    import json

    class InferenceHandler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/health':
                self.send_response(200)
                self.send_header('Content-type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps({"status": "ready"}).encode())
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            if self.path == '/v1/completions':
                # Simulasi latensi inferensi LLM
                time.sleep(2)
                self.send_response(200)
                self.send_header('Content-type', 'application/json')
                self.end_headers()
                response = {
                    "id": "cmpl-mock",
                    "choices": [{"text": " [Mocked LLM generation complete]"}]
                }
                self.wfile.write(json.dumps(response).encode())
            else:
                self.send_response(404)
                self.end_headers()

    server = http.server.HTTPServer(('0.0.0.0', 8000), InferenceHandler)
    server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mock
  labels:
    app: vllm-mock
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-mock
  template:
    metadata:
      labels:
        app: vllm-mock
    spec:
      # Beri pod waktu 30 detik untuk menyelesaikan request sebelum SIGKILL
      terminationGracePeriodSeconds: 30
      # Pastikan pod dijadwalkan ke node spot
      nodeSelector:
        node-type: spot
      containers:
      - name: mock-engine
        image: python:3.10-alpine
        command: ["python", "/app/server.py"]
        ports:
        - containerPort: 8000
        lifecycle:
          preStop:
            exec:
              command:
                # 1. Delay sebelum SIGTERM agar kube-proxy/endpoints sempat menghapus pod ini dari daftar routing
                - "/bin/sh"
                - "-c"
                - "sleep 5"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 3
        volumeMounts:
        - name: script-vol
          mountPath: /app
      volumes:
      - name: script-vol
        configMap:
          name: mock-vllm-script
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
spec:
  type: ClusterIP
  selector:
    app: vllm-mock
  ports:
  - port: 8000
    targetPort: 8000
